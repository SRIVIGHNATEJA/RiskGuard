<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISKGuard QA Lab</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>RISKGuard ML Dashboard</h1>
        
        <div class="section">
            <h2>Submit New Claim</h2>
            <form id="claimForm">
                <div class="form-group">
                    <label for="claim_amount">Claim Amount ($):</label>
                    <input type="number" id="claim_amount" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="previous_claim_count">Previous Claim Count:</label>
                    <input type="number" id="previous_claim_count" required>
                </div>
                
                <div class="form-group">
                    <label for="days_since_last_claim">Days Since Last Claim:</label>
                    <input type="number" id="days_since_last_claim" required>
                </div>
                
                <div class="form-group">
                    <label for="claim_category">Claim Category:</label>
                    <select id="claim_category" required>
                        <option value="AUTO">Auto</option>
                        <option value="HOME">Home</option>
                        <option value="HEALTH">Health</option>
                        <option value="LIFE">Life</option>
                        <option value="TRAVEL">Travel</option>
                    </select>
                </div>
                
                <button type="submit">Predict Risk</button>
            </form>
            <div id="submitResult" class="result-box"></div>
        </div>

        <div class="section">
            <h2>Retrieve Existing Claim</h2>
            <div class="form-group">
                <label for="search_claim_id">Claim ID:</label>
                <input type="text" id="search_claim_id">
            </div>
            <button id="retrieveBtn">Retrieve Claim</button>
            <div id="retrieveResult" class="result-box"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
